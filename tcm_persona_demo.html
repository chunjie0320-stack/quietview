function drawRadar(cv,vals,co,fill){
var ctx=cv.getContext('2d'),w=cv.width,h=cv.height,cx=w/2,cy=h/2,r=55;
ctx.clearRect(0,0,w,h);
var labs=['消费力','活跃度','签到','券额','客单价'];
var angles=[];for(var i=0;i<5;i++)angles.push(-Math.PI/2+i*2*Math.PI/5);
// Grid
[.25,.5,.75,1].forEach(function(s){
ctx.beginPath();for(var i=0;i<5;i++){var x=cx+r*s*Math.cos(angles[i]),y=cy+r*s*Math.sin(angles[i]);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.closePath();ctx.strokeStyle='rgba(0,0,0,.08)';ctx.stroke();
});
// Axes
angles.forEach(function(a){ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));ctx.strokeStyle='rgba(0,0,0,.06)';ctx.stroke();});
// Data
ctx.beginPath();
for(var i=0;i<5;i++){var v=vals[i]/100,x=cx+r*v*Math.cos(angles[i]),y=cy+r*v*Math.sin(angles[i]);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=co;ctx.lineWidth=2;ctx.stroke();
// Dots
for(var i=0;i<5;i++){var v=vals[i]/100,x=cx+r*v*Math.cos(angles[i]),y=cy+r*v*Math.sin(angles[i]);ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=co;ctx.fill();}
// Labels
ctx.fillStyle='#666';ctx.font='600 9px PingFang SC,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
for(var i=0;i<5;i++){var lx=cx+(r+16)*Math.cos(angles[i]),ly=cy+(r+16)*Math.sin(angles[i]);ctx.fillText(labs[i],lx,ly);}
}

function startCountdown(){
if(cdTimer)clearInterval(cdTimer);
var el=document.getElementById('cdwn');
var sec=47*3600+23*60+15;
function upd(){
if(sec<=0){clearInterval(cdTimer);el.textContent='已过期';return;}
var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s2=sec%60;
el.textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s2<10?'0':'')+s2;
sec--;
}
upd();cdTimer=setInterval(upd,1000);
}
