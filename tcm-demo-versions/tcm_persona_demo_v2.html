    {id:'❼',n:'紧迫感策略',v:'48h倒计时+断签不清零',d:'王姐：再签2天 / 小林：首签翻倍',co:'#D4A017'},
    {id:'❽',n:'Push策略',v:'过期提醒+限时优惠逼单',d:'王姐：VIP预告 / 小林：体验券',co:'#D4A017'}
  ]
}
};

// Draw SVG S-shape route
function drawRoute(){
  var pts=P.map(function(p){return{x:p.x+65,y:p.y+50}});
  var d='M'+pts[0].x+' '+pts[0].y;
  for(var i=0;i<pts.length-1;i++){
    var cx1=pts[i].x,cy1=pts[i].y+40;
    var cx2=pts[i+1].x,cy2=pts[i+1].y-40;
    d+=' C'+cx1+' '+cy1+' '+cx2+' '+cy2+' '+pts[i+1].x+' '+pts[i+1].y;
  }
  document.getElementById('rp').setAttribute('d',d);
}

// Render stations
function renderStations(key){
  var d=D[key],c=document.getElementById('sc');
  c.innerHTML='';
  for(var i=0;i<9;i++){
    var p=P[i],t=T[i],s=d.st[i];
    var isLeft=p.x<150;
    var wrap=document.createElement('div');
    wrap.className='sw';
    wrap.style.left=p.x+'px';
    wrap.style.top=p.y+'px';

    // Pin icon
    var pin=document.createElement('div');
    pin.className='pini';
    pin.textContent='\u{1f4cd}';
    pin.style.left=isLeft?'-18px':'132px';
    pin.style.top='30px';
    wrap.appendChild(pin);

    // Solar tag
    var tag=document.createElement('div');
    tag.className='stag';
    tag.textContent=t.n+' '+t.d;
    tag.style.transform='rotate('+(isLeft?'-2':'2')+'deg)';
    if(isLeft){tag.style.right='-10px';tag.style.top='-14px';}
    else{tag.style.left='-10px';tag.style.top='-14px';}
    wrap.appendChild(tag);

    // Polaroid card
    var pol=document.createElement('div');
    pol.className='pol'+(s.u?'':' lk');
    pol.style.transform='rotate('+p.r+'deg)';

    // Special effects
    var sp=d.sp[i];
    if(sp){
      if(sp.bk)pol.className+=' blink';
      if(sp.gw)pol.className+=' glowc';
    }
    if(s.w)pol.className+=' glowc';
    if(s.bk)pol.className+=' blink';

    // Photo area
    var photo=document.createElement('div');
    photo.className='pp '+p.s;
    var rabbit=document.createElement('div');
    rabbit.className='prab';
    rabbit.textContent='\u{1f430}';
    photo.appendChild(rabbit);
    pol.appendChild(photo);

    // Text
    var txt=document.createElement('div');
    txt.className='ptxt';
    txt.textContent=s.t;
    pol.appendChild(txt);

    // Status
    var sts=document.createElement('div');
    sts.className='psts';
    sts.style.color=s.u?'#4CAF50':(s.w?'#FF5722':'#999');
    sts.textContent=s.s;
    pol.appendChild(sts);

    // Badge
    if(s.u){
      var bdg=document.createElement('div');
      bdg.className='sbdg';
      bdg.textContent='✅';
      pol.appendChild(bdg);
    }else if(s.w){
      var bdg2=document.createElement('div');
      bdg2.className='sbdg blink';
      bdg2.textContent='⚠️';
      pol.appendChild(bdg2);
    }

    // Special label
    if(sp&&sp.lb){
      var lbl=document.createElement('div');
      lbl.style.cssText='position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);background:#FF5722;color:#fff;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;white-space:nowrap;z-index:25';
      if(sp.bk)lbl.className='blink';
      lbl.textContent=sp.lb;
      pol.appendChild(lbl);
    }

    wrap.appendChild(pol);
    c.appendChild(wrap);
  }
}

// Render coupons
function renderCoupons(key){
  var d=D[key],el=document.getElementById('cpr');
  el.innerHTML='';
  d.cp.forEach(function(c){
    el.innerHTML+='<div class="ci"><span class="cv">'+c.a+'</span>'+c.c+'</div>';
  });
}

// Render rewards
function renderRewards(key){
  var d=D[key],el=document.getElementById('ra');
  el.innerHTML='';
  d.rw.forEach(function(r){
    el.innerHTML+='<div class="ri"><span class="ric">'+r.i+'</span>'+r.l+'<div class="ris" style="color:'+r.c+'">'+r.s+'</div></div>';
  });
}

// Render side panel
function renderPanel(key){
  var d=D[key],el=document.getElementById('sp');
  var h='<div class="spn">'+d.nm+'</div><div class="spd">'+d.ds+'</div><ul class="dl">';
  d.dm.forEach(function(dm){
    h+='<li class="dit"><div class="dih"><div class="dib" style="background:'+dm.co+'">'+dm.id+'</div><span class="din">'+dm.n+'</span></div><div class="div">'+dm.v+'</div><div class="dif">'+dm.d+'</div></li>';
  });
  h+='</ul>';
  el.innerHTML=h;
  el.classList.add('fi');
  setTimeout(function(){el.classList.remove('fi')},500);
}

// Switch persona
function sw(key){
  var d=D[key];
  // Update tabs
  document.querySelectorAll('.ptab').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.ptab[data-p="'+key+'"]').classList.add('active');
  // Banner
  var ba=document.getElementById('ba');
  ba.style.background=d.bg;
  ba.style.color=d.fc;
  document.getElementById('bti').textContent=d.ti;
  document.getElementById('bsu').textContent=d.su;
  // Button
  var btn=document.getElementById('cbtn');
  btn.style.background=d.bb;
  btn.style.color=d.bc||'#fff';
  btn.textContent=d.bx;
  document.getElementById('chnt').textContent=d.ht;
  // Push
  document.getElementById('pfl').textContent=d.pu;
  // Render components
  renderCoupons(key);
  renderStations(key);
  renderRewards(key);
  renderPanel(key);
  // Scroll to top
  document.getElementById('psc').scrollTop=0;
}

// Init
drawRoute();
sw('wj');
</script>
