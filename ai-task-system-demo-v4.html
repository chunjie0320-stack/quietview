<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI任务系统</title>
<style>
:root {
  --primary:#3370FF;--primary-dark:#245BDB;--primary-light:#F0F5FF;--primary-hover:#4080FF;
  --secondary:#5856D6;--secondary-light:#F0F0FF;
  --bg:#F5F7FA;--surface:#FFFFFF;--surface-hover:#F7F8FA;--surface-active:#F0F5FF;
  --border:#DEE0E3;--border-light:#E5E6EB;--border-focus:#3370FF;
  --text:#1F2329;--text-secondary:#646A73;--text-tertiary:#8F959E;--text-link:#3370FF;
  --success:#00B42A;--success-light:#E8FFEA;--warning:#FF7D00;--warning-light:#FFF7E8;
  --error:#F53F3F;--info:#3370FF;
  --tag-draft:#8F959E;--tag-running:#00B42A;--tag-paused:#FF7D00;--tag-ended:#86909C;
  --font:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  --error-light:#FFEBE9;--info-light:#E5F8FF;
  --radius-sm:4px;--radius-md:6px;--radius-lg:8px;
  --font-mono:'SF Mono','Menlo','Monaco','Consolas',monospace;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14px;line-height:1.29;letter-spacing:0;color:var(--text);background:var(--bg)}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select{font-family:inherit;font-size:14px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #3370FF;outline-offset:2px}

.app{max-width:1440px;margin:0 auto;min-height:100vh}
.header{height:52px;background:#FFFFFF;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--border-light);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:100}
.header-title{font-size:20px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:0;line-height:1.14}
.logo{width:24px;height:24px;background:var(--primary);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#FFFFFF}

.tabs{height:44px;background:var(--surface);border-bottom:1px solid var(--border-light);display:flex;align-items:stretch;padding:0 24px;gap:32px}
.tab-btn{position:relative;font-size:14px;letter-spacing:0;color:var(--text-secondary);transition:color .15s;padding:0 4px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--text);font-weight:600}
.tab-btn.active::after{content:'';position:absolute;bottom:0;left:4px;right:4px;height:2px;background:var(--primary);border-radius:1px 1px 0 0}
.tabs-right{margin-left:auto;display:flex;align-items:center;gap:12px}

.btn-p{background:var(--primary);color:#FFFFFF;height:36px;padding:0 20px;border-radius:var(--radius-sm);font-weight:500;font-size:14px;letter-spacing:0;display:inline-flex;align-items:center;gap:4px;transition:all .2s ease}
.btn-p:hover{background:var(--primary-hover);box-shadow:none}
.btn-s{background:transparent;color:var(--text-link);border:1px solid var(--text-link);height:32px;padding:0 16px;border-radius:var(--radius-sm);font-size:14px;letter-spacing:0;display:inline-flex;align-items:center;gap:4px;transition:all .2s ease}
.btn-s:hover{background:rgba(51,112,255,0.06)}
.btn-t{background:transparent;color:var(--text-link);height:32px;padding:0 8px;font-size:14px;letter-spacing:0;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
.btn-t:hover{text-decoration:underline}
.btn-icon{width:28px;height:28px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:14px}
.btn-icon:hover{background:var(--surface-hover);color:var(--text)}

.content{padding:24px}
.panel{display:none}.panel.on{display:block}
.view{display:none}.view.on{display:block}

/* Search Box (Tab1) */
.search-box{display:flex;align-items:center;background:#FFFFFF;border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 14px;height:36px;width:280px;transition:all .2s ease;gap:8px;flex-shrink:0}
.search-box:focus-within{border-color:var(--border-focus);box-shadow:0 0 0 2px rgba(51,112,255,0.1);background:#fff}
.search-box .s-icon{color:var(--text-tertiary);font-size:14px;flex-shrink:0;line-height:1}
.search-box .s-input{border:none;background:transparent;outline:none;font-size:14px;color:var(--text);width:100%;font-family:var(--font);letter-spacing:0}
.search-box .s-input::placeholder{color:var(--text-tertiary)}
.search-box .s-clear{display:none;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--text-tertiary);color:#fff;font-size:10px;cursor:pointer;flex-shrink:0;line-height:1}
.search-box .s-clear:hover{background:var(--text-secondary)}
.search-box .s-clear.show{display:flex}

/* Task List (table-based) */
.task-list{display:flex;flex-direction:column;gap:0}

/* Step1 */
.s1-top{margin-bottom:16px;display:flex;align-items:center;gap:8px}
.s1-layout{display:flex;gap:24px;height:calc(100vh - 48px - 48px - 48px - 80px);min-height:520px}
.chat-p{flex:0 0 60%;display:flex;flex-direction:column;background:var(--surface);border:none;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.chat-hd{height:48px;padding:0 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,0,0,0.06);font-weight:500;letter-spacing:0}
.chat-hd .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.chat-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:8px;max-width:85%}
.msg.ai{align-self:flex-start}.msg.user{align-self:flex-end;flex-direction:row-reverse}
.avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.msg.ai .avatar{background:var(--primary-light)}.msg.user .avatar{background:var(--primary);color:#FFFFFF}
.bubble{padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.47;letter-spacing:0;white-space:pre-wrap}
.msg.ai .bubble{background:#F5F7FA;border-top-left-radius:2px}.msg.user .bubble{background:var(--primary-light);border-top-right-radius:2px}
.chat-in{height:64px;padding:0 16px;display:flex;align-items:center;gap:8px;border-top:1px solid rgba(0,0,0,0.06)}
.chat-input{flex:1;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);outline:none;font-size:14px;letter-spacing:0}
.chat-input:focus{border-color:var(--border-focus);box-shadow:0 0 0 2px rgba(51,112,255,0.1)}
.send-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px}
.send-btn:hover{background:var(--primary-hover)}

.elem-p{flex:0 0 40%;display:flex;flex-direction:column;background:var(--surface);border:none;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.elem-hd{padding:16px;border-bottom:1px solid rgba(0,0,0,0.06);font-size:16px;font-weight:600;letter-spacing:0;line-height:1.14}
.elem-form { padding: 16px; display: flex; flex-direction: column; gap: 0; }
.elem-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.04); }
.elem-row:last-child { border-bottom: none; }
.elem-row-label { width: 72px; flex-shrink: 0; font-size: 13px; color: var(--text-secondary); text-align: right; font-weight: 500; }
.elem-row-control { flex: 1; display: flex; align-items: center; gap: 8px; }
.elem-row-input {
  height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 13px; outline: none; font-family: inherit; width: 100%; max-width: 260px;
  color: var(--text); background: #FFFFFF;
  transition: all 0.2s ease;
}
.elem-row-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(51,112,255,0.1); }
.elem-row-input::placeholder { color: var(--text-tertiary); }
.elem-row-select {
  height: 32px; padding: 0 10px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 13px; background: #FFFFFF; cursor: pointer; outline: none; font-family: inherit;
  min-width: 160px; color: var(--text);
  transition: all 0.2s ease;
}
.elem-row-select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(51,112,255,0.1); }
.elem-row-date { 
  height: 32px; padding: 0 8px; border: 1px solid var(--border); border-radius: 4px;
  font-size: 13px; outline: none; font-family: inherit; color: var(--text); background: #FFFFFF;
  width: 140px; transition: all 0.2s ease;
}
.elem-row-date:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(51,112,255,0.1); }
/* Status indicator on each row */
.elem-status { 
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--border); transition: background 0.3s ease;
}
.elem-status.filled { background: var(--success); }
.elem-ft{padding:16px;border-top:1px solid rgba(0,0,0,0.06);display:flex;flex-direction:column;gap:8px}
.prog-wrap{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:0;color:var(--text-secondary)}
.prog-track{flex:1;height:3px;background:var(--border-light);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .3s}
.gen-wrap{text-align:center}

/* Step2 */
.s2-top{margin-bottom:16px;display:flex;align-items:center;gap:8px}
.s2-layout{display:flex;gap:16px;height:calc(100vh - 48px - 48px - 48px - 80px);min-height:520px}
.think-p{flex:0 0 40%;background:var(--surface);border:none;border-radius:var(--radius-md);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:var(--shadow-sm)}
.think-p::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--primary);border-radius:12px 0 0 12px}
.think-hd{padding:12px 16px 12px 20px;display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(0,0,0,0.06);font-size:14px;font-weight:500;letter-spacing:0;cursor:pointer;user-select:none}
.think-caret{transition:transform .3s}.think-hd.collapsed .think-caret{transform:rotate(-90deg)}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.think-body{flex:1;overflow-y:auto;padding:16px 20px;font-family:var(--font-mono);font-size:13px;line-height:24px;color:var(--text-secondary);transition:max-height .3s,padding .3s;background:#F5F7FA}
.think-body.collapsed{max-height:0!important;padding-top:0;padding-bottom:0;overflow:hidden}
.think-body .hl{color:var(--primary);font-weight:600}
.think-ft{padding:8px 20px;border-top:1px solid rgba(0,0,0,0.06);font-size:12px;letter-spacing:0;color:var(--text-tertiary)}



.atom-p{flex:1;background:var(--surface);border:none;border-radius:var(--radius-md);display:flex;flex-direction:column;overflow:visible;box-shadow:var(--shadow-sm)}
.atom-hd{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.06);font-size:16px;font-weight:600;letter-spacing:0;line-height:1.14}
.atom-bd{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.atom-ft{padding:16px;border-top:1px solid rgba(0,0,0,0.06);text-align:center}

/* Atom Config V4: Analysis-style */
.atom-section{margin-bottom:20px}
.atom-section-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:14px;font-weight:600;color:var(--text)}
.atom-section-badge{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#FFFFFF}
.atom-section-badge.behavior{background:#3370FF}
.atom-section-badge.constraint{background:#FF7D00}
.atom-section-badge.reward{background:#00B42A}
.atom-field-group{background:#F7F8FA;border:1px solid var(--border-light);border-radius:6px;padding:12px 16px}
.atom-field-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px}
.atom-field-row + .atom-field-row{border-top:1px solid rgba(0,0,0,0.04)}
.atom-field-label{width:80px;flex-shrink:0;font-size:13px;color:var(--text-secondary);text-align:right}
.atom-field-value{flex:1;display:flex;align-items:center;gap:8px}
.atom-field-tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;background:#F0F5FF;border:1px solid #B8D4FF;border-radius:4px;font-size:12px;font-weight:500;color:#3370FF}
.atom-field-input{height:28px;padding:0 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;outline:none;font-family:inherit}
.atom-field-input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(51,112,255,0.1)}
.atom-field-select{height:28px;padding:0 8px;border:1px solid var(--border);border-radius:4px;font-size:13px;background:#FFFFFF;cursor:pointer;outline:none}
.atom-field-toggle{position:relative;width:32px;height:18px;border-radius:9px;background:var(--border);cursor:pointer;transition:background 0.15s;display:inline-block}
.atom-field-toggle.on{background:#00B42A}
.atom-field-toggle::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#FFFFFF;transition:transform 0.15s;box-shadow:0 1px 2px rgba(0,0,0,0.1)}
.atom-field-toggle.on::after{transform:translateX(14px)}
.atom-logic-wrap{display:flex;flex-direction:column;gap:0}
/* Bracket + logic switch layout */
.atom-bracket-wrap{display:flex;align-items:stretch;position:relative;margin-left:4px}
.atom-bracket-line{width:10px;flex-shrink:0;position:relative}
.atom-bracket-line::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:#C9CDD4;border-radius:1px}
.atom-bracket-line::after{content:'';position:absolute;left:0;top:0;width:10px;height:3px;background:#C9CDD4}
.atom-bracket-bottom{position:absolute;left:0;bottom:0;width:10px;height:3px;background:#C9CDD4}
.atom-bracket-content{flex:1;min-width:0;padding-left:10px}
.atom-bracket-content .atom-section{margin-bottom:0}
.logic-switch-float{position:absolute;left:-33px;z-index:10;display:flex;flex-direction:column;border-radius:4px;overflow:hidden;cursor:pointer;user-select:none;box-shadow:0 1px 4px rgba(0,0,0,0.18)}
.logic-switch-half{display:flex;align-items:center;justify-content:center;width:28px;height:20px;font-size:12px;font-weight:600;color:#FFFFFF;transition:all 0.15s}
.logic-switch-half.active-and{background:#00B42A}
.logic-switch-half.active-or{background:#FF7D00}
.logic-switch-half.inactive{background:#E5E5E5;color:#999}
.logic-switch-float:hover{opacity:0.9}
.logic-divider{height:12px;position:relative}
.atom-add-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--primary);cursor:pointer;padding:8px 0;background:none;border:none;font-family:inherit}
.atom-add-btn:hover{text-decoration:underline}

/* Step3 */
.s3-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:24px}
.s3-check{width:80px;height:80px;border-radius:50%;background:var(--success-light);display:flex;align-items:center;justify-content:center;font-size:40px;animation:s3Pop .5s cubic-bezier(.68,-.55,.27,1.55)}
@keyframes s3Pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.s3-title{font-size:24px;font-weight:600;letter-spacing:0;line-height:1.14}
.s3-card{background:var(--surface);border:none;border-radius:var(--radius-md);padding:24px;width:480px;max-width:100%;box-shadow:var(--shadow-sm)}
.s3-row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;letter-spacing:0;border-bottom:1px solid rgba(0,0,0,0.04)}
.s3-row:last-child{border-bottom:none}
.s3-row-l{color:var(--text-secondary)}.s3-row-r{font-weight:500}

.hidden{display:none!important}

/* ===== Data Table (shared) ===== */
.data-table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm)}
.data-table th{text-align:left;padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-secondary);background:#FAFBFC;border-bottom:1px solid var(--border-light);white-space:nowrap;letter-spacing:0}
.data-table td{padding:12px 16px;font-size:14px;letter-spacing:0;border-bottom:1px solid rgba(0,0,0,0.04);vertical-align:middle}
.data-table tbody tr:hover>td{background:var(--surface-hover)}
.data-table tbody tr:last-child>td{border-bottom:none}
.data-table tbody tr.expand-row:hover>td{background:transparent}

/* Status Dot */
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.status-dot::before{content:'';width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.s-running{color:#00B42A}.status-dot.s-running::before{background:#00B42A}
.status-dot.s-draft{color:#8F959E}.status-dot.s-draft::before{background:#8F959E}
.status-dot.s-paused{color:#FF7D00}.status-dot.s-paused::before{background:#FF7D00}
.status-dot.s-ended{color:#86909C}.status-dot.s-ended::before{background:#86909C}
.status-dot.s-completed{color:var(--primary-dark)}.status-dot.s-completed::before{background:var(--primary-dark)}
.status-dot.s-expired{color:var(--text-tertiary)}.status-dot.s-expired::before{background:var(--text-tertiary)}

/* Op Links */
.op-link{color:var(--text-link);font-size:13px;cursor:pointer;padding:0 4px;background:none;border:none;font-family:var(--font);letter-spacing:0}
.op-link:hover{text-decoration:underline}
.op-link.danger{color:var(--error)}
.op-sep{color:var(--border);font-size:12px;margin:0 2px;user-select:none}

/* ===== Tab2: Form Styles ===== */
#tab-query{padding:24px;max-width:1440px;margin:0 auto}
.form-row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:13px;font-weight:500;color:var(--text-secondary);letter-spacing:0}
.form-input{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;letter-spacing:0;outline:none;width:200px;font-family:var(--font)}
.form-input:focus{border-color:var(--border-focus);box-shadow:0 0 0 2px rgba(51,112,255,0.1)}
.form-select{height:36px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;background:#fff;cursor:pointer;outline:none;font-family:var(--font)}
.form-btn{height:36px;padding:0 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer;border:none;font-family:var(--font);letter-spacing:0}
.form-btn-primary{background:var(--primary);color:#fff}.form-btn-primary:hover{background:var(--primary-hover)}
.form-btn-default{background:#fff;color:var(--text-secondary);border:1px solid var(--border)}.form-btn-default:hover{background:var(--surface-hover)}

/* Section Panel */
.section-panel{background:#FAFBFC;border:1px solid var(--border-light);border-radius:var(--radius-md);padding:16px 20px;margin-bottom:20px}
.section-title{font-size:14px;font-weight:600;letter-spacing:0;margin-bottom:12px;color:var(--text)}
.info-grid{display:flex;flex-wrap:wrap;gap:8px 32px}
.info-item{display:flex;gap:6px;font-size:14px;letter-spacing:0}
.info-item .il{color:var(--text-secondary)}
.info-item .iv{color:var(--text);font-weight:500}
.info-tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:500;letter-spacing:0}
.info-tag-active{background:var(--success-light);color:var(--success)}
.info-tag-signin{background:var(--primary-light);color:var(--primary-dark)}
.info-tag-food{background:var(--warning-light);color:var(--warning)}

/* Task Header Row */
.task-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.task-header-title{font-size:14px;font-weight:600;letter-spacing:0}

/* Expandable Row */
.expand-row>td{padding:0!important;border-bottom:1px solid rgba(0,0,0,0.04)}
.expand-content{background:#FAFBFC;padding:16px 24px;display:none}
.expand-content.open{display:block}
.expand-content .mini-table{width:100%;border-collapse:collapse;font-size:13px}
.expand-content .mini-table th{text-align:left;padding:6px 10px;font-size:12px;font-weight:600;color:var(--text-secondary);background:#F3F4F6;border-bottom:1px solid var(--border-light)}
.expand-content .mini-table td{padding:8px 10px;border-bottom:1px solid rgba(0,0,0,0.04)}
.expand-content .mini-table tr:last-child td{border-bottom:none}
.checkin-text{font-size:13px;line-height:1.8;color:var(--text-secondary);margin-top:10px}

/* Summary Line */
.summary-line{font-size:13px;color:var(--text-secondary);padding:12px 0;letter-spacing:0}

/* Query states */
.uq-loading{text-align:center;padding:60px 20px;display:none}

/* ===== Tab Switch ===== */
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function(b,i){b.classList.toggle('active',i===(tab==='list'?0:1))});
  document.getElementById('panel-list').className = tab==='list'?'panel on':'panel';
  document.getElementById('panel-list').style.display = tab==='list'?'':'none';
  document.getElementById('panel-query').className = tab==='query'?'panel on':'panel';
  document.getElementById('panel-query').style.display = tab==='query'?'':'none';
  document.getElementById('tabActions').style.display = tab==='list'?'':'none';
  if(tab==='list') goStep('list');
}

/* ===== View Switch ===== */
function goStep(v) {
  ['v-list','v-s1','v-s2','v-s3'].forEach(function(id){document.getElementById(id).className='view'});
  var map={list:'v-list',s1:'v-s1',s2:'v-s2',s3:'v-s3'};
  document.getElementById(map[v]).className='view on';
  document.getElementById('tabActions').style.display = v==='list'?'':'none';
  if(v==='s1') startChat();
  if(v==='s2'){ startThinking(); }
}

/* ===== Render Task List ===== */
function renderTasks(filter) {
  var html='<table class="data-table"><thead><tr>';
  html+='<th>任务名称</th><th>状态</th><th>类型</th><th>创建时间</th><th>创建人</th><th>参与人数</th><th>完成率</th><th>奖励发放</th><th>操作</th>';
  html+='</tr></thead><tbody>';
  var filterVal = (filter || '').toLowerCase();
  var hasRow = false;
  tasks.forEach(function(t){
    var s=statusCfg[t.status];
    if(filterVal && t.name.toLowerCase().indexOf(filterVal) === -1) return;
    hasRow = true;
    var dotCls = 's-' + t.status;
    html+='<tr>';
    html+='<td style="font-weight:500">'+t.name+'</td>';
    html+='<td><span class="status-dot '+dotCls+'">'+s.label+'</span></td>';
    html+='<td>'+t.type+'</td>';
    html+='<td style="color:var(--text-secondary);font-size:13px">'+t.time+'</td>';
    html+='<td>'+t.creator+'</td>';
    html+='<td>'+t.users.toLocaleString()+'</td>';
    html+='<td>'+t.rate+'</td>';
    html+='<td>'+t.rewards.toLocaleString()+'</td>';
    html+='<td style="white-space:nowrap">';
    html+='<button class="op-link">编辑</button><span class="op-sep">|</span>';
    if(t.status==='running'){
      html+='<button class="op-link">暂停</button><span class="op-sep">|</span>';
    } else if(t.status==='draft'||t.status==='paused'){
      html+='<button class="op-link">启动</button><span class="op-sep">|</span>';
    }
    html+='<button class="op-link">复制</button><span class="op-sep">|</span>';
    html+='<button class="op-link danger">删除</button>';
    html+='</td></tr>';
  });
  if(!hasRow){
    html+='<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-tertiary)">暂无匹配任务</td></tr>';
  }
  html+='</tbody></table>';
  document.getElementById('taskList').innerHTML=html;
}

/* ===== Chat Animation ===== */
var chatIdx=0, collected=0;
function startChat(){
  chatIdx=0; collected=0;
  document.getElementById('chatMsgs').innerHTML='';
  document.getElementById('progText').textContent='已收集 0/6';
  document.getElementById('progFill').style.width='0';
  document.getElementById('genWrap').style.display='none';
  // Reset form controls
  elements.forEach(function(e){
    e.value = '';
    var statusDot = document.getElementById('es-' + e.key);
    if(statusDot) statusDot.classList.remove('filled');
    if(e.type === 'select') {
      var sel = document.getElementById('ec-' + e.key);
      if(sel) sel.value = '';
    } else if(e.type === 'daterange') {
      var s = document.getElementById('ec-' + e.key + '-start');
      var d = document.getElementById('ec-' + e.key + '-end');
      if(s) s.value = '';
      if(d) d.value = '';
    } else {
      var inp = document.getElementById('ec-' + e.key);
      if(inp) inp.value = '';
    }
  });
  nextMsg();
}
function nextMsg(){
  if(chatIdx>=chatScript.length)return;
  var m=chatScript[chatIdx];
  var box=document.getElementById('chatMsgs');
  var div=document.createElement('div');
  div.className='msg '+m.role;
  div.innerHTML='<div class="avatar">'+(m.role==='ai'?'🤖':'👤')+'</div><div class="bubble">'+m.text+'</div>';
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
  if(m.collect){
    setTimeout(function(){
      var statusDot = document.getElementById('es-' + m.collect);
      if(statusDot) statusDot.classList.add('filled');
      
      // Find element config
      var elemObj = elements.find(function(e){ return e.key === m.collect; });
      if(elemObj && m.slotValue) {
        elemObj.value = m.slotValue;
        // Fill form control
        if(elemObj.type === 'select') {
          var sel = document.getElementById('ec-' + m.collect);
          if(sel) sel.value = m.slotValue;
        } else if(elemObj.type === 'daterange') {
          // Parse "5.20-6.05" → date inputs
          var startInput = document.getElementById('ec-' + m.collect + '-start');
          var endInput = document.getElementById('ec-' + m.collect + '-end');
          if(startInput && endInput) {
            startInput.value = '2026-05-20';
            endInput.value = '2026-06-05';
          }
        } else {
          var inp = document.getElementById('ec-' + m.collect);
          if(inp) inp.value = m.slotValue;
        }
      }
      collected++;
      document.getElementById('progText').textContent = '已收集 ' + collected + '/6';
      document.getElementById('progFill').style.width = (collected/6*100) + '%';
      if(collected >= 6) {
        document.getElementById('genWrap').style.display = '';
      }
    }, 400);
  }
  chatIdx++;
  if(chatIdx<chatScript.length) setTimeout(nextMsg, m.role==='ai'?1200:800);
}

function startThinking(){
  var body=document.getElementById('thinkBody');
  body.innerHTML='';
  body.className='think-body';
  document.getElementById('thinkHd').className='think-hd';
  var lineIdx=0;
  function typeLine(){
    if(lineIdx>=thinkLines.length)return;
    var ln=thinkLines[lineIdx];
    var div=document.createElement('div');
    div.style.marginBottom='4px';
    var t=ln.text;
    ln.hls.forEach(function(h){
      t=t.replace(h,'<span class="hl">'+h+'</span>');
    });
    div.innerHTML=t;
    body.appendChild(div);
    body.scrollTop=body.scrollHeight;
    lineIdx++;
    setTimeout(typeLine,200);
  }
  typeLine();
}

// Position logic switches on the rail between sections
function positionLogicSwitches(){
  var rail=document.getElementById('atomLogicRail');
  if(!rail) return;
  rail.innerHTML='';
  // 画真实竖线div
  var lineDiv=document.createElement('div');
  lineDiv.className='atom-logic-rail-line';
  rail.appendChild(lineDiv);
  var content=rail.nextElementSibling;
  var sections=content.querySelectorAll('.atom-section');
  if(sections.length<2) return;
  var wrapRect=rail.parentElement.getBoundingClientRect();
  for(var i=0;i<sections.length-1;i++){
    var secA=sections[i];
    var secB=sections[i+1];
    var bottomA=secA.getBoundingClientRect().bottom-wrapRect.top;
    var topB=secB.getBoundingClientRect().top-wrapRect.top;
    var midY=(bottomA+topB)/2;
    var sw=document.createElement('div');
    sw.className='logic-switch';
    sw.style.top=(midY-18)+'px';
    sw.setAttribute('data-state','and');
    sw.innerHTML='<div class="logic-switch-half active-and">且</div><div class="logic-switch-half inactive">或</div>';
    sw.onclick=function(){toggleLogic(this)};
    rail.appendChild(sw);
  }
}

// Logic connector toggle: 且↔或
function toggleLogic(el) {
  var halves=el.querySelectorAll('.logic-switch-half');
  if(el.getAttribute('data-state')==='and'){
    el.setAttribute('data-state','or');
    halves[0].className='logic-switch-half inactive';
    halves[0].textContent='且';
    halves[1].className='logic-switch-half active-or';
    halves[1].textContent='或';
  }else{
    el.setAttribute('data-state','and');
    halves[0].className='logic-switch-half active-and';
    halves[0].textContent='且';
    halves[1].className='logic-switch-half inactive';
    halves[1].textContent='或';
  }
}

    // Compute reward summary
    var claimed = 0, pending = 0;
    t.rewards.forEach(function(r){ if(r.cls==='claimed') claimed++; else pending++; });

    html += '<tr>';
    html += '<td style="font-weight:500">' + t.name + '</td>';

    html += '<td style="font-size:13px">' + t.progress.current + '/' + t.progress.total + t.progress.unit + ' ' + t.progress.percent + '%</td>';
    html += '<td style="font-size:13px">' + rewardText + '</td>';
    html += '<td><button class="op-link" onclick="toggleExpand(\'uq-expand-' + idx + '\',this)">详情</button></td>';

    // Expandable row

    // Reward detail table
    html += '<table class="mini-table"><thead><tr><th>奖励名称</th><th>奖励内容</th><th>状态</th></tr></thead><tbody>';
    t.rewards.forEach(function(r){
      html += '<tr><td>' + r.icon + ' ' + r.name + '</td><td>' + r.desc + '</td><td>' + r.status + '</td></tr>';
    });
    html += '</tbody></table>';
    // Checkin text
    if(t.checkin){
      html += '<div class="checkin-text">签到记录: ';
      t.checkin.forEach(function(c){
        html += (c.status === 'checked' ? '✅' : '⬜') + c.date + ' ';
      });
      html += '</div>';
    }
    html += '</div></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('uqTaskTable').innerHTML = html;
}

function toggleExpand(id, btn) {
  var el = document.getElementById(id);
  if(!el) return;
  var isOpen = el.classList.contains('open');
  // Close all first
  document.querySelectorAll('.expand-content').forEach(function(e){ e.classList.remove('open'); });
  document.querySelectorAll('.op-link-active').forEach(function(b){ b.classList.remove('op-link-active'); });
  if(!isOpen){
    el.classList.add('open');
  }
}

// Search handler
document.getElementById('uqSearchBtn').addEventListener('click', function() {
  var uid = document.getElementById('uqUserId').value.trim();
  var phone = document.getElementById('uqPhone').value.trim();
  var nick = document.getElementById('uqNickname').value.trim();
  if (!uid && !phone && !nick) return;
  document.getElementById('uqResult').style.display = 'none';
  document.getElementById('uqLoading').style.display = 'block';
  setTimeout(function() {
    document.getElementById('uqLoading').style.display = 'none';
    document.getElementById('uqResult').style.display = 'block';
    renderUserResult(mockUserData);
  }, 250);
});

document.getElementById('uqResetBtn').addEventListener('click', function() {
  document.getElementById('uqUserId').value = '';
  document.getElementById('uqPhone').value = '';
  document.getElementById('uqNickname').value = '';
  document.getElementById('uqResult').style.display = 'none';
});

['uqUserId','uqPhone','uqNickname'].forEach(function(id){
  document.getElementById(id).addEventListener('keydown', function(e) {
    if (e.key === 'Enter') document.getElementById('uqSearchBtn').click();
  });
});

// Filter select
document.getElementById('uqFilter').addEventListener('change', function() {
  renderUserTasks(mockUserData.tasks, this.value);
});

/* ===== Init ===== */
renderTasks();
renderElements();
renderAtoms();
</script>
