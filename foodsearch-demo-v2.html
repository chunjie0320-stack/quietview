<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI美食选题引擎 · Dashboard版</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7FAF5;
  --card: #FFFFFF;
  --primary: #4A9B6F;
  --primary-light: #7EC8A4;
  --accent: #FF7A5C;
  --text: #2C3E2D;
  --text2: #6B8C6E;
  --text3: #9BB89E;
  --border: #DCF0E4;
  --surface: #EDF5EF;
  --shadow: 0 2px 12px rgba(74,155,111,0.10);
  --shadow-lg: 0 6px 32px rgba(74,155,111,0.14);
  --r: 16px;
  --r-lg: 20px;
  --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-cn: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --transition: 0.28s cubic-bezier(0.4,0,0.2,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-cn); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ── Header ── */
.hdr {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.94);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 58px;
  display: flex; align-items: center; justify-content: space-between;
}
.hdr-logo { font-family: var(--font); font-size: 16px; font-weight: 700; color: var(--text); }
.hdr-logo span { color: var(--primary); }
.mode-tabs { display: flex; background: var(--surface); border-radius: 100px; padding: 3px; gap: 2px; border: 1px solid var(--border); }
.mode-tab {
  padding: 6px 18px; border-radius: 100px; font-size: 13px; font-weight: 500;
  cursor: pointer; border: none; background: transparent; color: var(--text2);
  transition: var(--transition); font-family: var(--font-cn); outline: none;
}
.mode-tab.active { background: linear-gradient(135deg, #4A9B6F, #7EC8A4); color: #fff; font-weight: 600; box-shadow: 0 2px 8px rgba(74,155,111,0.25); }
.hdr-subtitle { font-size: 12px; color: var(--text3); font-family: var(--font); }

/* ── Layout ── */
.layout { display: flex; height: calc(100vh - 58px); overflow: hidden; }

/* ── Left Panel ── */
.left-panel {
  width: 300px; flex-shrink: 0;
  background: var(--card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.left-scroll { flex: 1; overflow-y: auto; padding: 20px 18px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

.panel-label { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; font-family: var(--font); }

.input-wrap { margin-bottom: 16px; }
.input-mini {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
  border-radius: 12px; font-size: 13px; color: var(--text); background: var(--bg);
  font-family: var(--font-cn); resize: none; outline: none; line-height: 1.5;
  transition: border-color 0.2s;
}
.input-mini:focus { border-color: var(--primary); }

.btn-analyze {
  width: 100%; padding: 11px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #4A9B6F, #7EC8A4);
  color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  font-family: var(--font-cn); transition: var(--transition); outline: none;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-analyze:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(74,155,111,0.30); }

.divider { height: 1px; background: var(--border); margin: 14px 0; }

.tag-group { margin-bottom: 12px; }
.tag-group-label { font-size: 11px; color: var(--text3); margin-bottom: 6px; font-weight: 600; font-family: var(--font); }
.tags-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 500;
  border: 1.5px solid var(--border); color: var(--text2); cursor: pointer;
  transition: var(--transition); background: transparent;
}
.tag:hover { border-color: var(--primary); color: var(--primary); }
.tag.active { background: linear-gradient(135deg, #4A9B6F, #7EC8A4); color: #fff; border-color: transparent; }

/* Canvas area */
.canvas-wrap { margin-bottom: 4px; position: relative; }
#bubble-canvas { width: 100%; height: 200px; display: block; cursor: pointer; border-radius: 12px; background: var(--bg); }
.canvas-hint { font-size: 11px; color: var(--text3); text-align: center; margin-top: 6px; }
.legend-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.legend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--text2); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ── Right Panel ── */
.right-panel { flex: 1; overflow-y: auto; padding: 24px 28px; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

.right-empty {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 12px; color: var(--text3);
}
.right-empty .empty-icon { font-size: 48px; opacity: 0.5; }
.right-empty .empty-text { font-size: 15px; font-weight: 500; }
.right-empty .empty-sub { font-size: 13px; }

/* ── Right Content Cards ── */
.section-block {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 20px 22px; margin-bottom: 16px;
  box-shadow: var(--shadow); animation: fadeUp 0.32s ease both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

.block-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.block-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.block-title { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
.block-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* Metrics row */
.metrics-row { display: flex; gap: 10px; margin-bottom: 4px; }
.metric-card { flex: 1; background: var(--surface); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); }
.metric-val { font-size: 22px; font-weight: 700; color: var(--primary); font-family: var(--font); }
.metric-label { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* Bar */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-label { font-size: 12px; color: var(--text2); width: 60px; flex-shrink: 0; }
.bar-track { flex: 1; height: 6px; background: var(--surface); border-radius: 100px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 100px; background: linear-gradient(90deg, #4A9B6F, #7EC8A4); transition: width 0.6s ease; }
.bar-val { font-size: 11px; color: var(--text2); width: 28px; text-align: right; font-family: var(--font); font-weight: 600; }

/* Pain comments */
.pain-list { display: flex; flex-direction: column; gap: 8px; }
.pain-item { padding: 10px 13px; background: var(--bg); border-radius: 10px; border: 1px solid var(--border); font-size: 13px; color: var(--text); line-height: 1.55; }
.pain-author { font-size: 11px; color: var(--text3); margin-top: 5px; }

/* Supply prompt */
.prompt-box { background: #F0FAF5; border-radius: 12px; padding: 14px 16px; border: 1px solid #C4E8D4; }
.prompt-label { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-family: var(--font); }
.prompt-code { font-family: 'DM Mono','SF Mono','Fira Code',monospace; font-size: 11.5px; color: var(--text); line-height: 1.65; white-space: pre-wrap; }

/* Topic cards */
.topic-grid { display: flex; flex-direction: column; gap: 8px; }
.tc {
  padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--border);
  cursor: pointer; transition: var(--transition); background: var(--card);
  display: flex; align-items: flex-start; gap: 12px;
}
.tc:hover { border-color: var(--primary-light); background: #F5FCF8; }
.tc.active { border-color: var(--primary); background: linear-gradient(135deg, #F0FAF5, #FFFFFF); }
.tc-num { font-size: 10px; font-weight: 700; color: var(--text3); font-family: var(--font); text-transform: uppercase; letter-spacing: 0.5px; padding-top: 2px; width: 28px; flex-shrink: 0; }
.tc.active .tc-num { color: var(--primary); }
.tc-body { flex: 1; }
.tc-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.4; margin-bottom: 4px; }
.tc-reason { font-size: 12px; color: var(--text2); line-height: 1.45; }
.tc-arrow { font-size: 14px; color: var(--text3); padding-top: 2px; }
.tc.active .tc-arrow { color: var(--primary); }
.btn-gen {
  margin-top: 14px; padding: 11px 20px; border: none; border-radius: 100px;
  background: linear-gradient(135deg, #4A9B6F, #7EC8A4); color: #fff;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font-cn);
  transition: var(--transition); outline: none; display: flex; align-items: center; gap: 6px;
}
.btn-gen:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(74,155,111,0.28); }

/* Content preview */
.preview-cover {
  width: 100%; height: 180px; border-radius: 14px; overflow: hidden;
  margin-bottom: 14px; position: relative; background: linear-gradient(135deg, #2C3E2D, #4A9B6F);
}
.preview-cover img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
.preview-cover-text { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 18px; background: linear-gradient(transparent, rgba(0,0,0,0.55)); color: #fff; }
.preview-cover-title { font-size: 16px; font-weight: 700; line-height: 1.35; }
.preview-cover-sub { font-size: 12px; opacity: 0.8; margin-top: 3px; }

.supply-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.supply-item { padding: 12px 14px; background: var(--bg); border-radius: 12px; border: 1px solid var(--border); }
.supply-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
.supply-tag-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 100px; background: linear-gradient(135deg,#4A9B6F,#7EC8A4); color: #fff; margin-bottom: 6px; }
.supply-desc-text { font-size: 11.5px; color: var(--text2); line-height: 1.5; }
.stars { color: #FF9500; font-size: 11px; margin-top: 5px; }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">AI美食 <span>选题引擎</span></div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-commercial" onclick="switchMode('commercial')">💼 商业化</button>
    <button class="mode-tab" id="tab-content" onclick="switchMode('content')">📝 内容型</button>
  </div>
  <div class="hdr-subtitle">Dashboard · 北京美食版</div>
</header>

<div class="layout">
  <!-- LEFT -->
  <div class="left-panel">
    <div class="left-scroll">
      <div class="panel-label">选题方向</div>
      <div class="input-wrap">
        <textarea class="input-mini" id="user-input" rows="2">帮我做北京美食选题</textarea>
      </div>
      <button class="btn-analyze" onclick="onAnalyze()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        开始分析
      </button>

      <div class="divider"></div>

      <div class="panel-label">热点品类气泡图</div>
      <div class="canvas-wrap">
        <canvas id="bubble-canvas" width="264" height="200"></canvas>
        <div class="canvas-hint" id="canvas-hint">点击气泡查看详情 →</div>
      </div>
      <div class="legend-row">
        <div class="legend-item"><div class="legend-dot" style="background:#FF8C6B"></div>地道京味</div>
        <div class="legend-item"><div class="legend-dot" style="background:#5BB8E8"></div>新潮趋势</div>
        <div class="legend-item"><div class="legend-dot" style="background:#7DC87A"></div>夜市休闲</div>
      </div>

      <div class="divider"></div>

      <div class="panel-label">筛选条件</div>
      <div class="tag-group">
        <div class="tag-group-label">🗺️ 地区</div>
        <div class="tags-wrap">
          <span class="tag" onclick="toggleTag(this)">朝阳</span>
          <span class="tag" onclick="toggleTag(this)">西城</span>
          <span class="tag" onclick="toggleTag(this)">东城</span>
          <span class="tag" onclick="toggleTag(this)">海淀</span>
        </div>
      </div>
      <div class="tag-group">
        <div class="tag-group-label">🍜 品类</div>
        <div class="tags-wrap">
          <span class="tag" onclick="toggleTag(this)">地道京味</span>
          <span class="tag" onclick="toggleTag(this)">新潮趋势</span>
          <span class="tag" onclick="toggleTag(this)">夜市烧烤</span>
          <span class="tag" onclick="toggleTag(this)">老字号</span>
        </div>
      </div>
      <div class="tag-group">
        <div class="tag-group-label">👥 人群</div>
        <div class="tags-wrap">
          <span class="tag" onclick="toggleTag(this)">美食博主</span>
          <span class="tag" onclick="toggleTag(this)">外地游客</span>
          <span class="tag" onclick="toggleTag(this)">本地吃货</span>
          <span class="tag" onclick="toggleTag(this)">Z世代</span>
        </div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right-panel" id="right-panel">
    <div class="right-empty" id="right-empty">
      <div class="empty-icon">🍜</div>
      <div class="empty-text">点击左侧气泡开始分析</div>
      <div class="empty-sub">选择一个品类，查看热度数据、痛点洞察与选题方案</div>
    </div>
    <div id="right-content" style="display:none;"></div>
  </div>
</div>

<script>
var currentMode = 'commercial';
var selectedBubble = null;
var selectedTopicIdx = 0;

var bubbles = [

  { name:'铜锅涮肉',   heat:88, cx:0.65, cy:0.28, r:24, cat:'traditional', color:'#FF8C6B' },

  { name:'小吊梨汤',   heat:50, cx:0.18, cy:0.22, r:12, cat:'traditional', color:'#FF8C6B' }
];

var painData = {
  '烤鸭':       { pain: ['「四季民福排队3小时才吃上」「关晓彤忽悠我去了全聚德」', '游客区均价500+被诟病性价比低', '「老字号要完蛋了，本地人另有隐藏清单」', '排队vs预约的决策焦虑'], prompt: '请从美团平台筛选烤鸭商家：\n- 评分 ≥ 4.6，月销量 ≥ 300\n- 人均 150-400元\n- 标签含「片皮鸭」「脆皮」\n- 排除：连锁快餐、旅游区溢价\n- 输出：TOP 10，含均价、等位时长' },
  '铜锅涮肉':   { pain: ['「东来顺PK南门涮肉，400元差距实测」', '「别再踩东来顺的坑了」', '老北京麻酱比例存疑', '节假日等位2小时是常态'], prompt: '请筛选铜锅涮肉商家：\n- 评分 ≥ 4.5，月销量 ≥ 200\n- 人均 80-200元\n- 标签含「老北京」「麻酱」「铜锅」\n- 优先：含鲜牛肉、特色料碟\n- 输出：TOP 8，含人均和热度' },
  '咖啡特调':   { pain: ['「白塔寺药店耀咖啡」胡同特调成爆款', '古建+咖啡公式被过度复制，同质化严重', '特调定价30-45元性价比存疑', '下午茶座位竞争激烈'], prompt: '请筛选创意咖啡特调商家：\n- 评分 ≥ 4.7，月销量 ≥ 150\n- 人均 30-60元\n- 标签含「特调」「网红」「胡同」\n- 优先：有独特故事的场景咖啡\n- 输出：TOP 6' },
  '春季轻食':   { pain: ['「哪家是真食材哪家是料理包」', '低卡标注不透明，减脂党被坑', '「春日限定打工人午餐救星」', '价格与分量失衡严重'], prompt: '请筛选春季轻食商家：\n- 评分 ≥ 4.5，月销量 ≥ 100\n- 人均 40-80元\n- 标签含「低卡」「轻食」「沙拉」\n- 优先：真实热量标注、无料理包\n- 输出：TOP 6' },
  '北京烤串':   { pain: ['「来北京不吃脏摊儿烧烤等于白来」', '「丰台花街夜市铁板鱿鱼一口入魂」', '脏摊儿卫生标准不统一引发讨论', '「石景山铁道烤串风格封神」'], prompt: '请筛选夜市烤串商家：\n- 评分 ≥ 4.4，月销量 ≥ 300\n- 人均 50-120元\n- 标签含「烤串」「夜市」「羊肉串」\n- 优先：有特色地域标签\n- 输出：TOP 8' },
  '炸酱面':     { pain: ['海碗居排队现象严重', '各家酱料配比差异大，"正宗"标准模糊', '外地人不知道怎么拌，体验门槛高', '新店难以超越老字号口碑'], prompt: '请筛选炸酱面商家：\n- 评分 ≥ 4.5\n- 标签含「炸酱面」「老北京」\n- 优先：口碑老店、有传承故事\n- 输出：TOP 6' },
  '羊蝎子':     { pain: ['冬日爆款但夏季热度骤降，季节性强', '卤汤品质参差不齐', '鼓楼附近新开店质量良莠不齐', '踩雷率上升'], prompt: '请筛选羊蝎子商家：\n- 评分 ≥ 4.5，月销量 ≥ 100\n- 人均 80-150元\n- 标签含「羊蝎子」「秘制卤汤」\n- 输出：TOP 6' },

var canvasData = { w: 264, h: 200 };
var hoveredBubble = null;

function drawBubbles() {
  var canvas = document.getElementById('bubble-canvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  bubbles.forEach(function(b, i) {
    var x = b.cx * W, y = b.cy * H;
    var hex = b.color;
    var rgb = hexToRgb(hex);
    var isSelected = selectedBubble && selectedBubble.name === b.name;
    var isHovered = hoveredBubble && hoveredBubble.name === b.name;
    var alpha = (isSelected || isHovered) ? 0.75 : 0.45;
    ctx.beginPath();
    ctx.arc(x, y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + alpha + ')';
    ctx.fill();
    ctx.strokeStyle = isSelected ? hex : 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.8)';
    ctx.lineWidth = isSelected ? 2.5 : 1.5;
    ctx.stroke();
    if (isSelected) {
      ctx.beginPath(); ctx.arc(x, y, b.r + 5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',0.3)';
      ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.fillStyle = isSelected ? hex : '#2C3E2D';
    ctx.font = (b.r > 18 ? '11px' : '10px') + " 'PingFang SC', -apple-system, sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.name, x, y);
  });
}

function hexToRgb(hex) {
  var r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return {r:r,g:g,b:b};
}

function getBubbleAt(mx, my) {
  var canvas = document.getElementById('bubble-canvas');
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
  var x = (mx - rect.left) * scaleX, y = (my - rect.top) * scaleY;
  for (var i = bubbles.length - 1; i >= 0; i--) {
    var b = bubbles[i];
    var dx = x - b.cx * canvas.width, dy = y - b.cy * canvas.height;
    if (Math.sqrt(dx*dx + dy*dy) <= b.r) return b;
  }
  return null;
}

document.getElementById('bubble-canvas').addEventListener('click', function(e) {
  var b = getBubbleAt(e.clientX, e.clientY);
  if (b) { selectedBubble = b; drawBubbles(); showRightContent(b); }
});

document.getElementById('bubble-canvas').addEventListener('mousemove', function(e) {
  var b = getBubbleAt(e.clientX, e.clientY);
  hoveredBubble = b || null;
  this.style.cursor = b ? 'pointer' : 'default';
  drawBubbles();
});
